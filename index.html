<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONFIG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            color: #111;
            font-family: monospace, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .line-item {
            border-bottom: 1px solid #111;
            padding: 6px 0;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .separator {
            margin: 15px 0;
            border-bottom: 2px solid #111;
        }
    </style>
</head>
<body>

<div id="displayArea" class="container"></div>

<script>
function getRunAppHost() {
    const urlParams = new URLSearchParams(window.location.search);
    const hostOverride = urlParams.get('host');
    if (hostOverride) return hostOverride;

    const hostname = window.location.hostname;
    return hostname ? hostname : 'NULL';
}

function loadConfig() {
    const host = getRunAppHost();
    const displayArea = document.getElementById('displayArea');

    const lines = [
        "VLESS",
        "UUID: cxlvin777",
        "PATH: /CxlvinVlWS",
        `SERVER HOST: ${host}`,
        "---SEP---",
        "SSH",
        "USER/PASS: cxlvin:cxlvin",
        "PAYLOAD:",
        `GET /cxlvin HTTP/1.1[crlf]Host: ${host}[crlf]Upgrade: websocket[crlf]Connection: Upgrade[crlf][crlf]`
    ];

    displayArea.innerHTML = '';
    
    lines.forEach(lineText => {
        if (lineText === "---SEP---") {
            const sep = document.createElement('div');
            sep.className = 'separator';
            displayArea.appendChild(sep);
        } else {
            const row = document.createElement('div');
            row.className = 'line-item';
            row.textContent = lineText;
            displayArea.appendChild(row);
        }
    });
}

document.addEventListener('DOMContentLoaded', loadConfig);
</script>

</body>
</html>
