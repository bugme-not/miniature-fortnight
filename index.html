<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONFIG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            color: #111;
            font-family: monospace, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .display-content {
            width: 100%;
            max-width: 600px;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div id="displayArea" class="display-content"></div>

<script>
const template = `VLESS
UUID: cxlvin777
PATH: /CxlvinVlWS
SERVER HOST: __RUN_APP_HOST__

========================================

SSH
USER/PASS:
cxlvin:cxlvin

PAYLOAD:
GET /cxlvin HTTP/1.1[crlf]Host: __RUN_APP_HOST__[crlf]Upgrade: websocket[crlf]Connection: Upgrade[crlf][crlf]`;

function getRunAppHost() {
    const urlParams = new URLSearchParams(window.location.search);
    const hostOverride = urlParams.get('host');
    if (hostOverride) return hostOverride;

    const hostname = window.location.hostname;
    return hostname ? hostname : 'NULL';
}

function loadConfig() {
    const host = getRunAppHost();
    document.getElementById('displayArea').textContent = template.replaceAll('__RUN_APP_HOST__', host);
}

document.addEventListener('DOMContentLoaded', loadConfig);
</script>

</body>
</html>
