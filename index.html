<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONFIG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            color: #111;
            font-family: monospace, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .btn-group {
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            background: #fff;
            border: 2px solid #000;
            padding: 10px 24px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            min-width: 110px;
        }
        button.active {
            background: #000;
            color: #fff;
        }
        .display-content {
            width: 100%;
            max-width: 600px;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="btn-group">
    <button id="vlessBtn" class="active" onclick="showConfig('vless')">VLESS</button>
    <button id="sshBtn" onclick="showConfig('ssh')">SSH</button>
</div>

<div id="displayArea" class="display-content"></div>

<script>
const configs = {
    vless: `UUID: cxlvin777
PATH: /CxlvinVlWS
SERVER HOST: __RUN_APP_HOST__`,
    
    ssh: `USER/PASS:
cxlvin:cxlvin

PAYLOAD:
GET /cxlvin HTTP/1.1[crlf]Host: __RUN_APP_HOST__[crlf]Upgrade: websocket[crlf]Connection: Upgrade[crlf][crlf]`
};

function getRunAppHost() {
    const urlParams = new URLSearchParams(window.location.search);
    const hostOverride = urlParams.get('host');
    if (hostOverride) return hostOverride;

    const hostname = window.location.hostname;
    return hostname ? hostname : 'NULL';
}

function showConfig(type) {
    const host = getRunAppHost();
    
    document.getElementById('displayArea').textContent = configs[type].replaceAll('__RUN_APP_HOST__', host);
    
    document.querySelectorAll('.btn-group button').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`${type}Btn`).classList.add('active');
}

document.addEventListener('DOMContentLoaded', () => showConfig('vless'));
</script>

</body>
</html>
